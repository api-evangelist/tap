name: Tap
description: >-
  TAP (Training All People, Inc.) is a next-generation technician training platform for advanced and
  precision manufacturers. TAP combines online courses (pneumatics, electrical fundamentals, robotics,
  safety, and semiconductor basics) with immersive VR simulations that replicate real factory equipment
  and procedures, plus in-simulation quizzes, VR scenario assessments, and workforce skills-profiling
  dashboards. The platform lets manufacturers evaluate, standardize, and upskill their technician
  workforce at scale while minimizing disruption to production. Customers include Northrop Grumman, ACC,
  SUNY, and Dallas College. Backed by 8vc and surfaced into the API Evangelist network as a portfolio
  company; TAP currently publishes no public developer API surface.
